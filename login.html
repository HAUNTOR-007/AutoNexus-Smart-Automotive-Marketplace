<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication | AutoNexus</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { 
  --bg-primary: #111111; 
  --bg-secondary: #1B1B1B; 
  --bg-surface: #242424; 
  --bg-input: #2B2B2B; 
  --accent: #C1121F; 
  --accent-hover: #E01A2B; 
  --text-primary: #FFFFFF; 
  --text-secondary: #CFCFCF; 
  --text-muted: #8A8A8A; 
  --border-color: #3A3A3A; 
  --transition: all 0.3s ease; 
  --font-display: 'Oswald', sans-serif; 
  --font-body: 'Inter', sans-serif; 
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-neu: 6px 6px 12px #0b0b0b, -6px -6px 12px #232323;
  --shadow-neu-inset: inset 4px 4px 8px #0b0b0b, inset -4px -4px 8px #232323;
  --shadow-neu-hover: 4px 4px 8px #0b0b0b, -4px -4px 8px #232323;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background-color: var(--bg-primary); color: var(--text-secondary); font-family: var(--font-body); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
a { text-decoration: none; color: inherit; }
.navbar { position: sticky; top: 0; z-index: 1000; background-color: var(--bg-primary); border-bottom: 1px solid var(--border-color); }
.navbar-inner { display: flex; align-items: center; justify-content: space-between; height: 78px; padding: 0 24px; max-width: 1240px; margin: 0 auto; }
.logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-primary); }
.logo span { color: var(--accent); }

/* Authentication Container */
.login-section { flex: 1; display:flex; align-items:center; justify-content:center; padding:60px 24px; background:radial-gradient(ellipse at 50% 0%,rgba(193,18,31,0.08) 0%,var(--bg-primary) 60%); }
.login-logo { font-family:var(--font-display); font-size:1.5rem; font-weight:700; letter-spacing:1.5px; color:var(--text-primary); margin-bottom:4px; }
.login-logo span { color:var(--accent); }
.login-tagline { font-size:0.85rem; color:var(--text-muted); margin-bottom:24px; }

/* Mode Switch Tabs */
.auth-tabs { display: flex; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; padding: 4px; margin-bottom: 24px; box-shadow: var(--shadow-neu-inset); }
.auth-tab { flex: 1; padding: 10px; text-align: center; font-size: 0.88rem; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-radius: 4px; cursor: pointer; transition: var(--transition); }
.auth-tab.active { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-color); box-shadow: var(--shadow-neu); }

/* Form Components */
.form-group { margin-bottom: 18px; position: relative; }
.form-label { display:block; font-size:0.82rem; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
.input-wrapper { position: relative; width: 100%; }
.form-input { width:100%; background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-color); border-radius:6px; padding:12px 16px; font-family:var(--font-body); font-size:0.92rem; transition:var(--transition); box-shadow: var(--shadow-neu-inset); }
.form-input:focus { border-color:var(--accent); outline:none; box-shadow: var(--shadow-neu-inset), 0 0 0 2px rgba(193, 18, 31, 0.2); }
.password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-family: var(--font-body); padding: 4px; }
.password-toggle:hover { color: var(--text-primary); }

/* Feedback Messages */
.status-message { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-neu); }
.status-message.error { background: rgba(193, 18, 31, 0.15); border: 1px solid var(--accent); color: #FF6B6B; }
.status-message.success { background: rgba(40, 167, 69, 0.15); border: 1px solid #28A745; color: #51CF66; }

.form-submit { width:100%; padding:14px; font-size:0.95rem; margin-top:8px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-neu); }
.form-submit:hover:not(:disabled) { background:var(--accent-hover); box-shadow: var(--shadow-neu-hover); transform: translateY(-1px); }
.form-submit:active { box-shadow: var(--shadow-neu-inset); transform: translateY(1px); }
.form-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.form-footer { margin-top: 18px; text-align: center; font-size: 0.82rem; color: var(--text-muted); }
.form-footer button { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; }
.form-footer button:hover { text-decoration: underline; }

/* Electric Border Styles */
.electric-border {
  --electric-light-color: oklch(from var(--electric-border-color) l c h);
  position: relative;
  border-radius: inherit;
  overflow: visible;
  isolation: isolate;
  width: 100%;
  max-width: 460px;
}
.eb-canvas-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}
.eb-canvas { display: block; }
.eb-content {
  position: relative;
  border-radius: inherit;
  z-index: 1;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 40px 36px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.eb-layers {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 0;
}
.eb-glow-1, .eb-glow-2, .eb-background-glow {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-sizing: border-box;
}
.eb-glow-1 {
  border: 2px solid oklch(from var(--electric-border-color) l c h / 0.6);
  filter: blur(1px);
}
.eb-glow-2 {
  border: 2px solid var(--electric-light-color);
  filter: blur(4px);
}
.eb-background-glow {
  z-index: -1;
  transform: scale(1.1);
  filter: blur(32px);
  opacity: 0.3;
  background: linear-gradient(-30deg, var(--electric-light-color), transparent, var(--electric-border-color));
}
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">AUTO<span>NEXUS</span></a>
  </div>
</header>

<section class="login-section">
  <div id="react-login-container"></div>
</section>

<script>
// Authentication Storage & Crypto Helpers
const AuthEngine = {
  getDB: (key, fallback) => {
    try {
      const data = localStorage.getItem('autonexus_' + key);
      return data ? JSON.parse(data) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  setDB: (key, data) => {
    localStorage.setItem('autonexus_' + key, JSON.stringify(data));
  },
  
  // Secure SHA-256 Hashing via Web Crypto API
  hashPassword: async (password) => {
    const encoder = new TextEncoder();
    const data = encoder.encode(password + '_autonexus_salt_2026');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  },

  // Generates secure session representation
  createSession: (user) => {
    const sessionToken = 'ANX-' + Array.from(crypto.getRandomValues(new Uint8Array(16)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    
    const sessionData = {
      token: sessionToken,
      userId: user.id,
      email: user.email,
      name: user.name,
      role: user.role || 'user',
      expiresAt: Date.now() + (24 * 60 * 60 * 1000) // 24 Hours
    };
    
    AuthEngine.setDB('currentUser', sessionData);
    return sessionData;
  }
};
</script>

<script type="text/babel">
  const { useEffect, useRef, useCallback, useState } = React;

  const ElectricBorder = ({
    children,
    color = '#C1121F',
    speed = 1,
    chaos = 0.12,
    borderRadius = 12,
    className,
    style
  }) => {
    const canvasRef = useRef(null);
    const containerRef = useRef(null);
    const animationRef = useRef(null);
    const timeRef = useRef(0);
    const lastFrameTimeRef = useRef(0);

    const random = useCallback(x => {
      return (Math.sin(x * 12.9898) * 43758.5453) % 1;
    }, []);

    const noise2D = useCallback(
      (x, y) => {
        const i = Math.floor(x);
        const j = Math.floor(y);
        const fx = x - i;
        const fy = y - j;

        const a = random(i + j * 57);
        const b = random(i + 1 + j * 57);
        const c = random(i + (j + 1) * 57);
        const d = random(i + 1 + (j + 1) * 57);

        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uy = fy * fy * (3.0 - 2.0 * fy);

        return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
      },
      [random]
    );

    const octavedNoise = useCallback(
      (x, octaves, lacunarity, gain, baseAmplitude, baseFrequency, time, seed, baseFlatness) => {
        let y = 0;
        let amplitude = baseAmplitude;
        let frequency = baseFrequency;

        for (let i = 0; i < octaves; i++) {
          let octaveAmplitude = amplitude;
          if (i === 0) {
            octaveAmplitude *= baseFlatness;
          }
          y += octaveAmplitude * noise2D(frequency * x + seed * 100, time * frequency * 0.3);
          frequency *= lacunarity;
          amplitude *= gain;
        }

        return y;
      },
      [noise2D]
    );

    const getCornerPoint = useCallback((centerX, centerY, radius, startAngle, arcLength, progress) => {
      const angle = startAngle + progress * arcLength;
      return {
        x: centerX + radius * Math.cos(angle),
        y: centerY + radius * Math.sin(angle)
      };
    }, []);

    const getRoundedRectPoint = useCallback(
      (t, left, top, width, height, radius) => {
        const straightWidth = width - 2 * radius;
        const straightHeight = height - 2 * radius;
        const cornerArc = (Math.PI * radius) / 2;
        const totalPerimeter = 2 * straightWidth + 2 * straightHeight + 4 * cornerArc;
        const distance = t * totalPerimeter;

        let accumulated = 0;

        if (distance <= accumulated + straightWidth) {
          const progress = (distance - accumulated) / straightWidth;
          return { x: left + radius + progress * straightWidth, y: top };
        }
        accumulated += straightWidth;

        if (distance <= accumulated + cornerArc) {
          const progress = (distance - accumulated) / cornerArc;
          return getCornerPoint(left + width - radius, top + radius, radius, -Math.PI / 2, Math.PI / 2, progress);
        }
        accumulated += cornerArc;

        if (distance <= accumulated + straightHeight) {
          const progress = (distance - accumulated) / straightHeight;
          return { x: left + width, y: top + radius + progress * straightHeight };
        }
        accumulated += straightHeight;

        if (distance <= accumulated + cornerArc) {
          const progress = (distance - accumulated) / cornerArc;
          return getCornerPoint(left + width - radius, top + height - radius, radius, 0, Math.PI / 2, progress);
        }
        accumulated += cornerArc;

        if (distance <= accumulated + straightWidth) {
          const progress = (distance - accumulated) / straightWidth;
          return { x: left + width - radius - progress * straightWidth, y: top + height };
        }
        accumulated += straightWidth;

        if (distance <= accumulated + cornerArc) {
          const progress = (distance - accumulated) / cornerArc;
          return getCornerPoint(left + radius, top + height - radius, radius, Math.PI / 2, Math.PI / 2, progress);
        }
        accumulated += cornerArc;

        if (distance <= accumulated + straightHeight) {
          const progress = (distance - accumulated) / straightHeight;
          return { x: left, y: top + height - radius - progress * straightHeight };
        }
        accumulated += straightHeight;

        const progress = (distance - accumulated) / cornerArc;
        return getCornerPoint(left + radius, top + radius, radius, Math.PI, Math.PI / 2, progress);
      },
      [getCornerPoint]
    );

    useEffect(() => {
      const canvas = canvasRef.current;
      const container = containerRef.current;
      if (!canvas || !container) return;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const octaves = 10;
      const lacunarity = 1.6;
      const gain = 0.7;
      const amplitude = chaos;
      const frequency = 10;
      const baseFlatness = 0;
      const displacement = 60;
      const borderOffset = 60;

      const updateSize = () => {
        const rect = container.getBoundingClientRect();
        const width = rect.width + borderOffset * 2;
        const height = rect.height + borderOffset * 2;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.scale(dpr, dpr);

        return { width, height };
      };

      let { width, height } = updateSize();
      let lastDpr = Math.min(window.devicePixelRatio || 1, 2);

      const drawElectricBorder = currentTime => {
        if (!canvas || !ctx) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (dpr !== lastDpr) {
          lastDpr = dpr;
          const newSize = updateSize();
          width = newSize.width;
          height = newSize.height;
        }

        const deltaTime = (currentTime - lastFrameTimeRef.current) / 1000;
        timeRef.current += deltaTime * speed;
        lastFrameTimeRef.current = currentTime;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.scale(dpr, dpr);

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const scale = displacement;
        const left = borderOffset;
        const top = borderOffset;
        const borderWidth = width - 2 * borderOffset;
        const borderHeight = height - 2 * borderOffset;
        const maxRadius = Math.min(borderWidth, borderHeight) / 2;
        const radius = Math.min(borderRadius, maxRadius);

        const approximatePerimeter = 2 * (borderWidth + borderHeight) + 2 * Math.PI * radius;
        const sampleCount = Math.floor(approximatePerimeter / 2);

        ctx.beginPath();

        for (let i = 0; i <= sampleCount; i++) {
          const progress = i / sampleCount;
          const point = getRoundedRectPoint(progress, left, top, borderWidth, borderHeight, radius);

          const xNoise = octavedNoise(
            progress * 8, octaves, lacunarity, gain, amplitude, frequency, timeRef.current, 0, baseFlatness
          );
          const yNoise = octavedNoise(
            progress * 8, octaves, lacunarity, gain, amplitude, frequency, timeRef.current, 1, baseFlatness
          );

          const displacedX = point.x + xNoise * scale;
          const displacedY = point.y + yNoise * scale;

          if (i === 0) {
            ctx.moveTo(displacedX, displacedY);
          } else {
            ctx.lineTo(displacedX, displacedY);
          }
        }

        ctx.closePath();
        ctx.stroke();

        animationRef.current = requestAnimationFrame(drawElectricBorder);
      };

      const resizeObserver = new ResizeObserver(() => {
        const newSize = updateSize();
        width = newSize.width;
        height = newSize.height;
      });
      resizeObserver.observe(container);

      animationRef.current = requestAnimationFrame(drawElectricBorder);

      return () => {
        if (animationRef.current) {
          cancelAnimationFrame(animationRef.current);
        }
        resizeObserver.disconnect();
      };
    }, [color, speed, chaos, borderRadius, octavedNoise, getRoundedRectPoint]);

    const vars = {
      '--electric-border-color': color,
      borderRadius: `${borderRadius}px`
    };

    return (
      <div ref={containerRef} className={`electric-border ${className ?? ''}`} style={{ ...vars, ...style }}>
        <div className="eb-canvas-container">
          <canvas ref={canvasRef} className="eb-canvas" />
        </div>
        <div className="eb-layers">
          <div className="eb-glow-1" />
          <div className="eb-glow-2" />
          <div className="eb-background-glow" />
        </div>
        <div className="eb-content">{children}</div>
      </div>
    );
  };

  function LoginApp() {
    const [mode, setMode] = useState('login'); // 'login', 'signin', or 'forgot'
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [name, setName] = useState('');
    const [showPassword, setShowPassword] = useState(false);
    
    const [status, setStatus] = useState({ type: '', message: '' });
    const [loading, setLoading] = useState(false);

    // Clear status when changing mode
    const handleModeSwitch = (newMode) => {
      setMode(newMode);
      setStatus({ type: '', message: '' });
    };

    const validateInputs = () => {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        setStatus({ type: 'error', message: 'Please enter a valid email address.' });
        return false;
      }

      if (mode !== 'forgot' && password.length < 6) {
        setStatus({ type: 'error', message: 'Password must be at least 6 characters long.' });
        return false;
      }

      if (mode === 'signin' && !name.trim()) {
        setStatus({ type: 'error', message: 'Please enter your full name.' });
        return false;
      }

      return true;
    };

    const handleSubmit = async (e) => {
      e.preventDefault();
      setStatus({ type: '', message: '' });

      if (!validateInputs()) return;

      setLoading(true);

      try {
        const cleanEmail = email.trim().toLowerCase();
        let users = AuthEngine.getDB('users', []);
        
        // Mode: Password Reset Request
        if (mode === 'forgot') {
          await new Promise(resolve => setTimeout(resolve, 800)); // Simulated delay
          setStatus({
            type: 'success',
            message: 'If an account exists for this email, password reset instructions have been sent.'
          });
          setLoading(false);
          return;
        }

        const passwordHash = await AuthEngine.hashPassword(password);

        // Mode: Login
        if (mode === 'login') {
          if (window.location.protocol.startsWith('http')) {
            try {
              const res = await fetch('api/auth.php?action=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: cleanEmail, password: password })
              });
              const data = await res.json();
              if (data.success && (data.user || data.data)) {
                const userObj = data.user || data.data;
                AuthEngine.createSession(userObj);
                setStatus({ type: 'success', message: `${userObj.role === 'admin' ? 'Admin' : 'User'} authenticated! Redirecting...` });
                setTimeout(() => {
                  window.location.href = userObj.role === 'admin' ? 'admin.html' : 'index.html';
                }, 800);
                return;
              } else {
                setStatus({ type: 'error', message: data.error || 'Invalid email address or password.' });
                setLoading(false);
                return;
              }
            } catch (err) {
              console.warn('Backend login fallback to local cache:', err);
            }
          }

          // Check administrator role local fallback
          if (cleanEmail === 'admin@autonexus.com') {
            const adminHash = await AuthEngine.hashPassword('admin123');
            if (passwordHash === adminHash) {
              const session = AuthEngine.createSession({
                id: 'ADM-001',
                email: cleanEmail,
                name: 'System Administrator',
                role: 'admin'
              });
              setStatus({ type: 'success', message: 'Admin authenticated. Redirecting...' });
              setTimeout(() => { window.location.href = 'admin.html'; }, 800);
              return;
            }
          }

          const existingUser = users.find(u => u.email === cleanEmail);

          if (existingUser && existingUser.passwordHash === passwordHash) {
            AuthEngine.createSession(existingUser);
            setStatus({ type: 'success', message: 'Logged in successfully! Redirecting...' });
            setTimeout(() => { window.location.href = 'index.html'; }, 800);
          } else {
            setStatus({ type: 'error', message: 'Invalid email address or password.' });
          }
        } 
        // Mode: Sign In (Account Registration)
        else if (mode === 'signin') {
          if (window.location.protocol.startsWith('http')) {
            try {
              const res = await fetch('api/auth.php?action=register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim(), email: cleanEmail, password: password })
              });
              const data = await res.json();
              if (data.success && (data.user || data.data)) {
                const userObj = data.user || data.data;
                AuthEngine.createSession(userObj);
                setStatus({ type: 'success', message: 'Account created and saved to MySQL database! Redirecting...' });
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
                return;
              } else {
                setStatus({ type: 'error', message: data.error || 'Registration failed.' });
                setLoading(false);
                return;
              }
            } catch (err) {
              console.warn('Backend registration fallback to local cache:', err);
            }
          }

          const userExists = users.some(u => u.email === cleanEmail);

          if (userExists) {
            setStatus({ type: 'error', message: 'An account with this email already exists.' });
            setLoading(false);
            return;
          }

          const newUser = {
            id: 'USR-' + Math.floor(100000 + Math.random() * 900000),
            email: cleanEmail,
            passwordHash: passwordHash,
            name: name.trim(),
            role: 'user',
            createdAt: new Date().toISOString()
          };

          users.push(newUser);
          AuthEngine.setDB('users', users);
          AuthEngine.createSession(newUser);

          setStatus({ type: 'success', message: 'Account created and signed in successfully! Redirecting...' });
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        }
      } catch (err) {
        setStatus({ type: 'error', message: 'An unexpected error occurred. Please try again.' });
      } finally {
        setLoading(false);
      }
    };

    return (
      <ElectricBorder color="#C1121F" speed={0.8} chaos={0.13} borderRadius={12}>
        <div>
          <p className="login-logo">AUTO<span>NEXUS</span></p>
          <p className="login-tagline">
            {mode === 'login' && 'Login to access your AutoNexus account.'}
            {mode === 'signin' && 'Sign in to create a new AutoNexus account.'}
            {mode === 'forgot' && 'Reset your AutoNexus password.'}
          </p>

          <div className="auth-tabs">
            <button 
              type="button" 
              className={`auth-tab ${mode === 'login' ? 'active' : ''}`} 
              onClick={() => handleModeSwitch('login')}
            >
              Login
            </button>
            <button 
              type="button" 
              className={`auth-tab ${mode === 'signin' ? 'active' : ''}`} 
              onClick={() => handleModeSwitch('signin')}
            >
              Sign In
            </button>
          </div>

          {status.message && (
            <div className={`status-message ${status.type}`}>
              {status.message}
            </div>
          )}

          <form onSubmit={handleSubmit}>
            {mode === 'signin' && (
              <div className="form-group">
                <label className="form-label">Full Name</label>
                <input 
                  type="text" 
                  className="form-input" 
                  placeholder="John Doe" 
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  required 
                />
              </div>
            )}

            <div className="form-group">
              <label className="form-label">Email Address</label>
              <input 
                type="email" 
                className="form-input" 
                placeholder="name@example.com" 
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                required 
              />
            </div>

            {mode !== 'forgot' && (
              <div className="form-group">
                <label className="form-label">Password</label>
                <div className="input-wrapper">
                  <input 
                    type={showPassword ? 'text' : 'password'} 
                    className="form-input" 
                    placeholder="••••••••" 
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required 
                  />
                  <button 
                    type="button" 
                    className="password-toggle"
                    onClick={() => setShowPassword(!showPassword)}
                  >
                    {showPassword ? 'Hide' : 'Show'}
                  </button>
                </div>
              </div>
            )}

            <button type="submit" className="form-submit" disabled={loading}>
              {loading ? 'Processing...' : (
                mode === 'login' ? 'Login' : (mode === 'signin' ? 'Sign In' : 'Send Reset Link')
              )}
            </button>
          </form>

          <div className="form-footer">
            {mode === 'login' && (
              <button type="button" onClick={() => handleModeSwitch('forgot')}>
                Forgot your password?
              </button>
            )}
            {mode === 'forgot' && (
              <button type="button" onClick={() => handleModeSwitch('login')}>
                Back to Login
              </button>
            )}
          </div>
        </div>
      </ElectricBorder>
    );
  }

  const container = document.getElementById('react-login-container');
  const root = ReactDOM.createRoot(container);
  root.render(<LoginApp />);
</script>

</body>
</html>
